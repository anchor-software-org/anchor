name: Bug report
description: Report a reproducible problem in Anchor.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include private messages, certificate fingerprints, private keys, or credentials. For a vulnerability, email devs@anchor-software.org instead."
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Android app, Linux desktop, Website, Rust SDK, Kotlin SDK, Swift preview, Protocol]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.3.0 or abc1234"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Android version/device, or Linux distribution, desktop environment, compositor, and GPU."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
