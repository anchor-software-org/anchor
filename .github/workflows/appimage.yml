name: AppImage Build

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "anchor-desktop/**"
      - "assets/**"
      - "scripts/build-appimage.sh"
      - "scripts/build-appimage-container.sh"
      - "scripts/appimage-builder/**"
      - ".github/workflows/appimage.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      # The runner image ships a stale apt index; without an update the cache
      # action downloads superseded package versions and the mirror 404s.
      - name: Update apt index
        run: sudo apt-get update

      - name: Install system build deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            protobuf-compiler
            pkg-config
            cmake
            nasm
            libx264-dev
            libva-dev
            libgtk-3-dev
            libwayland-dev
            libdrm-dev
            libgbm-dev
            libxkbcommon-dev
            libavcodec-dev
            libavformat-dev
            libavutil-dev
            libavfilter-dev
            libswscale-dev
            libswresample-dev
            libavdevice-dev
            libclang-dev
            libdbus-1-dev
            libssl-dev
            libayatana-appindicator3-dev
            libwebkit2gtk-4.1-dev
            libxdo-dev
            llvm-dev
            libfuse2
            file
            libjack-jackd2-0
            libasound2
            adb
          # Bump this when the package set changes; otherwise the action can
          # restore an older architecture-specific cache without new libraries.
          version: 1.4

      # The apt cache action can restore an older cache that predates a newly
      # added package. Install protoc explicitly so every architecture has the
      # compiler required by anchor-sdk's schema build script.
      - name: Ensure protocol compiler is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: anchor-desktop/frontend/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            anchor-desktop
          cache-on-failure: true
          shared-key: appimage-ubuntu-22.04-${{ matrix.arch }}

      # libsphinxbase links against BLAS/LAPACK. Install via plain apt (real
      # dpkg runs the postinst -> update-alternatives, creating the
      # libblas.so.3 / liblapack.so.3 symlinks). The awalsh128 cache action
      # skips postinst on a cache hit, so the symlinks would be missing and
      # the link step fails with undefined sposv_/ssymm_/spotrf_ refs.
      - name: Install BLAS/LAPACK for linking
        run: sudo apt-get install -y libblas3 liblapack3

      # Single source of truth: this script is also what `build-image` runs
      # locally inside the Ubuntu 22.04 builder container. It builds the
      # frontend + release binary, assembles AppDir, and packages with a
      # pinned, sha256-verified appimagetool.
      - name: Build and package AppImage
        env:
          ARCH: ${{ matrix.arch }}
        working-directory: .
        run: bash scripts/ci/appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: anchor-AppImage-${{ matrix.arch }}-${{ github.sha }}
          path: anchor-desktop/target/appimage/Anchor-*.AppImage
          if-no-files-found: error
          retention-days: 14
