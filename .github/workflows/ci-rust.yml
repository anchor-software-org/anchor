name: Rust CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: anchor-desktop

jobs:
  sdk-conformance:
    name: SDK source conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install protocol compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify SDK source checkout
        working-directory: .
        run: bash scripts/ci/sdk-conformance.sh

  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            pkg-config \
            cmake \
            nasm \
            libx264-dev \
            libva-dev \
            libgtk-3-dev \
            libwayland-dev \
            libdrm-dev \
            libgbm-dev \
            libxkbcommon-dev \
            libclang-dev \
            libdbus-1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            llvm-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: anchor-desktop/frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            anchor-desktop

      # The job's step list lives in the script so local runs match exactly;
      # it also fetches the pinned prebuilt FFmpeg (PR CI doesn't ship the
      # binary, so vendoring FFmpeg from source would dominate runtime).
      - name: fmt + clippy + test
        working-directory: .
        run: bash scripts/ci/check.sh
