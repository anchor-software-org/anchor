name: Anchor
options:
  bundleIdPrefix: com.anchor
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic

packages:
  AnchorSDK:
    path: ../anchor-sdk/swift

targets:
  Anchor:
    type: application
    platform: iOS
    sources:
      - path: Anchor
    dependencies:
      - package: AnchorSDK
    settings:
      base:
        INFOPLIST_FILE: Anchor/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.anchor.software
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    entitlements:
      path: Anchor/Anchor.entitlements
      properties:
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.anchor.software

  AnchorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnchorTests
    dependencies:
      - target: Anchor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anchor.software.tests
