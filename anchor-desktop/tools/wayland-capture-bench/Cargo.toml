[package]
name = "wayland-capture-bench"
version = "0.1.0"
edition = "2024"
publish = false

# This is deliberately a separate crate. It imports only Anchor's capture-side
# modules and avoids bringing the application, encoder, and network paths into
# a measurement run.
[dependencies]
drm = "0.14.1"
gbm = "0.18.0"
libc = "0.2"
log = "0.4.29"
wayland-client = "0.31.11"
wayland-protocols = "0.32.9"
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }
