[package]
name = "anchor"
version = "0.3.0"
edition = "2024"

[features]
default = ["ffmpeg-vendor"]

# Compile FFmpeg 8.1 from source. The default everywhere: local development,
# release builds, and any CI job not explicitly opting out. Do not disable
# this outside of the PR-validation CI job; see ci-rust.yml.
ffmpeg-vendor = [
    "ffmpeg-next/build",
    "ffmpeg-next/build-license-gpl",
    "ffmpeg-next/build-lib-x264",
    "ffmpeg-sys-next/build-drm",
    "ffmpeg-sys-next/build-vaapi",
]

# Link a prebuilt FFmpeg via the FFMPEG_DIR env var instead of building from
# source. CI-only (see ci-rust.yml) - never enable for local development or
# release builds.
ffmpeg-prebuilt = []

[dependencies]
drm = "0.15.0"
gbm = "0.18.0"
log = { version = "0.4.29", features = ["std"] }
ffmpeg-next = { version = "8.1" }
ffmpeg-sys-next = { version = "8.1" }
serde_json = "1.0.149"
wayland-client = "0.31.11"
wayland-protocols = "0.32.9"
wayland-protocols-wlr = { version = "0.3.9", features = ['client'] }
wayland-protocols-misc = { version = "0.3", features = ['client'] }
xkbcommon = "0.8"
rustls = "0.23.36"
rcgen = "0.14.7"
rustls-pemfile = "2.2.0"
uuid = { version = "1.21.0", features = ["v4"] }
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25.9", default-features = false, features = ["png", "ico", "jpeg"] }
url = "2"
reqwest = { version = "0.13", features = ["blocking"] }
anyhow = "1.0.102"
rusqlite = "0.38.0"
libc = "0.2"
notify-rust = "4"
rfd = "0.15"
anchor-wl-clipboard = { git = "https://github.com/anchor-software-org/anchor-wl-clipboard", rev = "a76c760f6abc057d04662da8cc9a8bb28f3de13e" }
anchor-sdk = { path = "../anchor-sdk/rust" }
prost = "0.14.4"
bytes = "1"
quinn = "0.11.9"
tokio = { version = "1.48.0", features = ["io-util", "rt", "time", "sync"] }
zstd = "0.13"
flate2 = "1"
mdns-sd = "0.13"
# Media playback control: read/control local MPRIS players, and expose the
# phone as an MPRIS player so the system media widget / media keys drive it.
mpris = "2.1"
souvlaki = "0.7"
mimalloc = "0.1"
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
debug = false
overflow-checks = false
lto = false
codegen-units = 16
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true
strip = false
